schema: spec-driven

# Contexto del proyecto: restricciones que el agente no puede deducir leyendo el código.
context: |
  trAIde: dashboard web educativo que importa una cartera de inversión simulada desde un
  XLSX de posiciones abiertas y cerradas y ofrece Watchlist con ST/LT, TWR, estrategias
  por indicador, backtesting y hasta 10 operaciones recomendadas.

  Idioma: todos los artefactos se escriben en castellano; solo las palabras clave
  RFC-2119 (SHALL, MUST, SHOULD, MAY) van en inglés y en mayúsculas.

  Alcance del MVP (no ampliar sin un change explícito):
  - Una única cartera, sin autenticación; cada importación válida sustituye a la anterior.
  - Moneda única USD; sin conversión de divisas, dividendos, splits, comisiones,
    deslizamiento, saldo de efectivo ni posiciones cortas.
  - Una fila del XLSX = una posición; no hay asignación FIFO de ventas a lotes.
  - Datos de mercado diarios (OHLC) de un proveedor externo gratuito, cacheados en BD.
  - Producto educativo: nunca ejecuta órdenes reales y siempre muestra que no constituye
    asesoramiento financiero.

  Stack: backend Python 3.12 + FastAPI + Pydantic v2, pandas y numpy, dependencias con
  uv (uv.lock, uv sync --frozen); PostgreSQL 16 con SQLAlchemy 2 y Alembic; indicadores
  con TA-Lib >= 0.6.5 detrás del puerto IndicadoresTecnicos; datos de mercado con
  yfinance (auto_adjust=False) y un proveedor de ficheros para tests y demo; frontend
  React 18 + TypeScript + Vite con TanStack Query/Table, Recharts y Lightweight Charts,
  y tipos generados con openapi-typescript; Docker Compose (db, migrate, api, web con
  nginx) solo en local, GitHub Actions y GHCR.
  Arquitectura: monolito modular hexagonal con dominio puro sin I/O y siete puertos
  (LectorCartera, ProveedorPrecios, RepositorioCartera, CachePrecios, Reloj, ClienteLLM,
  IndicadoresTecnicos); fronteras comprobadas con import-linter en el backend y ESLint
  import/no-restricted-paths en el frontend. Detalle en las secciones 2 y 3 del readme.

  Fuente de verdad: las specs vivas de openspec/specs/. El readme.md se deriva de ellas y
  de los artefactos de los changes; si divergen, prevalecen las specs.

  Entregas: la Entrega 1 (documentación técnica) está cerrada en la rama
  feature/entrega-1-sg, que no se modifica. En la Entrega 2 se implementa el flujo
  principal con los tickets OPS-01, DB-01, SEC-01, BE-01a, BE-01b, BE-02, BE-07 y FE-01,
  y el backtesting con BE-03, BE-04, BE-05, FE-03 y FE-04 (sección 6 del readme). Las
  specs aún no implementadas quedan como pendientes en el script de trazabilidad con el
  ticket que las cubrirá. Cada ticket es un change de OpenSpec con tareas de código;
  lleva skip_specs: true salvo que el ticket cambie comportamiento observable, en cuyo
  caso incluye su delta.

# Reglas por artefacto
rules:
  proposal:
    - Indica qué feature (F1-F5 o S1-S3) y qué historia de usuario (HU-n) cubre el change.
    - Incluye siempre una sección de fuera de alcance.
  specs:
    - Cada requisito usa "### Requirement:" con SHALL y al menos un "#### Scenario:" con viñetas "- **WHEN**" y "- **THEN**".
    - Describe solo comportamiento observable desde fuera, sin nombres de clase ni rutas de archivo; en backend, la petición y la respuesta HTTP; en frontend, lo que la persona ve y puede hacer en pantalla.
    - Los escenarios de cálculo financiero llevan ejemplos numéricos concretos que puedan convertirse en tests.
  design:
    - Justifica cada decisión con alternativas descartadas, beneficios y sacrificios.
    - Usa diagramas Mermaid para arquitectura y modelo de datos (erDiagram con PK, FK y restricciones).
    - Importes y cantidades en tipos decimales exactos, nunca float.
    - Incluye las implicaciones de seguridad de la subida de ficheros cuando aplique.
  tasks:
    - Agrupa las tareas por tipo (base de datos, backend, frontend, tests, devops) y referencia la HU.
    - Cada tarea incluye criterios de aceptación verificables.
    - Las tareas de código citan los escenarios que cubren con el identificador `capability::Requirement::Scenario` y cumplen la Definition of Done común de la sección 6 del readme.

# Indicaciones por operación
operations:
  apply:
    guidance:
      - Tras completar las tareas, actualiza las secciones del readme.md afectadas según la tabla de trazabilidad de su sección 2.3.
  archive:
    guidance:
      - Antes de archivar, comprueba que el readme.md no contradice las specs actualizadas.
