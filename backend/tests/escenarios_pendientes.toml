# Escenarios de las specs vivas que aún no tienen test, agrupados por el ticket que los
# cubrirá (backlog de la sección 6 del readme; design T3 y T5 de qa-01-trazabilidad).
#
# El script tests/trazabilidad.py falla si un escenario no tiene test ni está aquí, si un
# escenario de esta lista ya tiene test o si una entrada no coincide con ningún escenario.
# Cada ticket quita sus escenarios en el mismo commit en el que añade sus tests; si solo
# cubre parte de un patrón con "*", lo sustituye por los escenarios que siguen pendientes.
#
# Formatos: "capability::Requirement::Scenario", "capability::Requirement::*" y
# "capability::*".

